# Builds xcl.exe (release) on a GitHub Windows runner and uploads it as a downloadable
# artifact (Actions -> this run -> Artifacts -> xcl-windows-x64). Pushing a tag v* also
# attaches the zip to a GitHub release.
#
# The zip holds only XCL's own files. DXC (dxcompiler.dll / dxil.dll), the D3D12 Agility SDK
# and XGameRuntime come from your own system / the Windows SDK, as described in README.md.
name: Build xcl.exe

on:
  workflow_dispatch:
  push:
    branches: [main, build-exe]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: Rust (stable, MSVC)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-release-${{ runner.os }}-

      - name: Build
        run: cargo build --release --workspace

      - name: Package
        shell: pwsh
        run: |
          $out = "dist\xcl"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target\release\xcl.exe $out
          if (Test-Path target\release\xcl.pdb) { Copy-Item target\release\xcl.pdb $out }
          foreach ($f in 'README.md', 'LICENSE', 'THIRD_PARTY.md') { if (Test-Path $f) { Copy-Item $f $out } }
          Compress-Archive -Path "$out\*" -DestinationPath dist\xcl-windows-x64.zip
          Get-ChildItem $out

      - uses: actions/upload-artifact@v4
        with:
          name: xcl-windows-x64
          path: dist/xcl/
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/xcl-windows-x64.zip
